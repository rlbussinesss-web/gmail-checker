<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Checker Pro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
      min-height: 100vh;
      color: #e0e0e0;
      overflow-x: hidden;
    }

    /* Fundo animado */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        radial-gradient(circle at 20% 50%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: -1;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
      z-index: 1;
    }

    .logo-box {
      display: inline-block;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      padding: 20px 30px;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 20px 60px rgba(59, 130, 246, 0.2);
    }

    .logo {
      font-size: 32px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #ffffff 0%, #a0aec0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #7c8aad;
      font-size: 15px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 15px;
      margin-bottom: 40px;
      border-bottom: 2px solid #1e2749;
      padding-bottom: 0;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #7c8aad;
      padding: 15px 25px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tab-btn:hover {
      color: #a0aec0;
    }

    .tab-btn.active {
      color: #3b82f6;
      border-bottom-color: #3b82f6;
    }

    .stats-btn {
      margin-left: auto;
      background: linear-gradient(135deg, #3b82f6 0%, #1e40af 100%);
      color: white;
      padding: 12px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
      transition: all 0.3s ease;
    }

    .stats-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(59, 130, 246, 0.3);
    }

    /* Main Content */
    .content {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.8) 0%, rgba(30, 39, 73, 0.8) 100%);
      border: 1px solid rgba(59, 130, 246, 0.15);
      border-radius: 20px;
      padding: 50px;
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 30px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }

    label {
      display: block;
      color: #a0aec0;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 12px;
    }

    input[type="email"],
    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 16px 18px;
      background: rgba(15, 23, 42, 0.6);
      border: 1.5px solid rgba(59, 130, 246, 0.2);
      border-radius: 12px;
      color: #e0e0e0;
      font-size: 14px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="email"]::placeholder,
    input[type="text"]::placeholder,
    textarea::placeholder {
      color: #4b5563;
    }

    input[type="email"]:focus,
    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 150px;
      font-family: 'Courier New', monospace;
    }

    /* Buttons */
    .btn {
      padding: 16px 32px;
      background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.2);
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(59, 130, 246, 0.3);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      margin-top: 12px;
    }

    .btn-secondary:hover {
      background: rgba(59, 130, 246, 0.25);
    }

    /* Alert */
    .alert {
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      display: none;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    /* Results */
    .results-section {
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.6) 0%, rgba(30, 39, 73, 0.6) 100%);
      border: 1px solid rgba(59, 130, 246, 0.1);
      border-radius: 16px;
      padding: 30px;
      margin-top: 40px;
      display: none;
    }

    .results-section.show {
      display: block;
    }

    .result-item {
      background: rgba(15, 23, 42, 0.8);
      border-left: 4px solid #3b82f6;
      padding: 20px;
      margin-bottom: 15px;
      border-radius: 10px;
      transition: all 0.3s ease;
    }

    .result-item:hover {
      background: rgba(15, 23, 42, 0.95);
      transform: translateX(5px);
    }

    .result-item.success {
      border-left-color: #10b981;
      background: rgba(16, 185, 129, 0.05);
    }

    .result-email {
      font-weight: 700;
      color: #e0e0e0;
      font-size: 15px;
      margin-bottom: 8px;
    }

    .result-password {
      color: #86efac;
      font-size: 13px;
      font-weight: 600;
    }

    .result-date {
      color: #4b5563;
      font-size: 12px;
      margin-top: 8px;
    }

    /* Settings Section */
    .settings-section {
      margin-top: 60px;
      padding-top: 40px;
      border-top: 2px solid #1e2749;
    }

    .settings-section h2 {
      font-size: 18px;
      font-weight: 700;
      color: #e0e0e0;
      margin-bottom: 25px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .password-list {
      display: grid;
      gap: 12px;
    }

    .password-item {
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 16px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(59, 130, 246, 0.1);
    }

    .password-item button {
      width: auto;
      padding: 6px 12px;
      font-size: 11px;
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
    }

    .loading {
      text-align: center;
      color: #7c8aad;
      padding: 40px;
      display: none;
    }

    .spinner {
      display: inline-block;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .content {
        padding: 30px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 28px;
      }

      .tabs {
        flex-direction: column;
      }

      .stats-btn {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo-box">
        <div class="logo">🔐</div>
      </div>
      <h1>Gmail Checker Pro</h1>
      <p class="subtitle">Validador de Credenciais Enterprise</p>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('individual')">📧 Individual</button>
      <button class="tab-btn" onclick="switchTab('batch')">📋 Em Massa</button>
      <a href="/stats" class="stats-btn">📊 Estatísticas</a>
    </div>

    <!-- Content -->
    <div class="content">
      <div id="alert" class="alert"></div>

      <!-- Individual Tab -->
      <div id="individual-tab" class="tab-content">
        <form id="checkerForm" onsubmit="testEmail(event)">
          <div class="form-row">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" placeholder="seu@email.com" required>
            </div>
            <div class="form-group">
              <label for="provider">Provider</label>
              <select id="provider">
                <option value="gmail">Gmail</option>
                <option value="outlook">Outlook</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn">🔍 Testar Email</button>
          <button type="button" class="btn btn-secondary" onclick="diagnose()">🔧 Diagnóstico</button>
        </form>
      </div>

      <!-- Batch Tab -->
      <div id="batch-tab" class="tab-content" style="display: none;">
        <form id="batchForm" onsubmit="testBatch(event)">
          <div class="form-group">
            <label for="emails">Emails (um por linha)</label>
            <textarea id="emails" placeholder="email1@gmail.com&#10;email2@gmail.com" required></textarea>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="batchPasswordSelect">Senha</label>
              <select id="batchPasswordSelect" required>
                <option value="">-- Selecione uma senha --</option>
              </select>
            </div>
            <div class="form-group">
              <label for="batchProvider">Provider</label>
              <select id="batchProvider">
                <option value="gmail">Gmail</option>
                <option value="outlook">Outlook</option>
              </select>
            </div>
          </div>

          <button type="submit" class="btn">⚡ Testar Todos</button>
        </form>
      </div>

      <!-- Results -->
      <div id="results-section" class="results-section">
        <h2 style="margin-bottom: 20px; color: #e0e0e0;">📊 Resultados</h2>
        <div id="resultsList"></div>
      </div>

      <!-- Settings -->
      <div class="settings-section">
        <h2>⚙️ Gerenciar Senhas</h2>

        <div class="form-row">
          <div class="form-group">
            <label for="newPassword">Adicionar Nova Senha</label>
            <input type="text" id="newPassword" placeholder="Digite uma senha">
          </div>
          <div class="form-group" style="display: flex; align-items: flex-end;">
            <button type="button" class="btn" onclick="addPassword()" style="width: 100%; margin-bottom: 0;">➕ Adicionar</button>
          </div>
        </div>

        <div class="password-list" id="passwordsList"></div>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p>Testando credenciais...</p>
  </div>

  <script>
    // Funções básicas
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tab + '-tab').style.display = 'block';
      event.target.classList.add('active');
    }

    function showAlert(msg, type = 'success') {
      const alert = document.getElementById('alert');
      alert.textContent = msg;
      alert.className = 'alert ' + (type === 'error' ? 'error' : '');
      alert.style.display = 'block';
      setTimeout(() => alert.style.display = 'none', 5000);
    }

    async function testEmail(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const provider = document.getElementById('provider').value;

      document.getElementById('loading').style.display = 'block';

      try {
        const response = await fetch('/api/check', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, provider })
        });

        const result = await response.json();
        showAlert(result.message, result.success ? 'success' : 'error');
        loadResults();
      } catch (error) {
        showAlert('Erro: ' + error.message, 'error');
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    }

    async function loadResults() {
      try {
        const response = await fetch('/api/results');
        const results = await response.json();

        if (results.length === 0) {
          document.getElementById('resultsList').innerHTML = '<p style="color: #7c8aad;">Nenhum resultado ainda</p>';
        } else {
          document.getElementById('resultsList').innerHTML = results
            .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))
            .map(r => `
              <div class="result-item ${r.status === 'SUCCESS' ? 'success' : ''}">
                <div class="result-email">${r.email}</div>
                ${r.status === 'SUCCESS' ? `<div class="result-password">✅ Senha: ${r.password}</div>` : ''}
                <div class="result-date">${new Date(r.timestamp).toLocaleString('pt-BR')}</div>
              </div>
            `).join('');
        }

        document.getElementById('results-section').classList.add('show');
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    async function addPassword() {
      const pwd = document.getElementById('newPassword').value;
      if (!pwd) return showAlert('Digite uma senha', 'error');

      try {
        const response = await fetch('/api/passwords', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pwd })
        });

        if (response.ok) {
          document.getElementById('newPassword').value = '';
          showAlert('✅ Senha adicionada!');
          loadPasswords();
        }
      } catch (error) {
        showAlert('Erro: ' + error.message, 'error');
      }
    }

    async function loadPasswords() {
      try {
        const response = await fetch('/api/passwords');
        const data = await response.json();

        document.getElementById('passwordsList').innerHTML = data.custom
          .map((pwd, idx) => `
            <div class="password-item">
              <span>${pwd}</span>
              <button type="button" onclick="removePassword(${idx})">🗑️ Remover</button>
            </div>
          `).join('');

        const select = document.getElementById('batchPasswordSelect');
        select.innerHTML = '<option value="">-- Selecione uma senha --</option>' +
          data.custom.map(pwd => `<option value="${pwd}">${pwd}</option>`).join('');
      } catch (error) {
        console.error('Erro:', error);
      }
    }

    async function removePassword(idx) {
      try {
        await fetch(`/api/passwords/${idx}`, { method: 'DELETE' });
        loadPasswords();
      } catch (error) {
        showAlert('Erro: ' + error.message, 'error');
      }
    }

    async function testBatch(e) {
      e.preventDefault();
      showAlert('Funcionando em breve!');
    }

    async function diagnose() {
      showAlert('Diagnóstico em desenvolvimento');
    }

    // Carregar dados ao iniciar
    loadResults();
    loadPasswords();
  </script>
</body>
</html>
